<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo redondeado -->
  <rect width="64" height="64" rx="12" fill="#1e2128"/>

  <!-- Torre vertical de la grúa -->
  <rect x="22" y="18" width="7" height="34" rx="1.5" fill="#f0a500"/>

  <!-- Pluma horizontal (brazo largo izquierda→derecha) -->
  <rect x="10" y="18" width="42" height="5" rx="1.5" fill="#f0a500"/>

  <!-- Contrapeso (bloque izquierdo) -->
  <rect x="10" y="23" width="8" height="6" rx="1" fill="#e09000"/>

  <!-- Cable vertical desde punta de pluma -->
  <line x1="48" y1="23" x2="48" y2="38" stroke="#f0a500" stroke-width="2" stroke-linecap="round"/>

  <!-- Gancho -->
  <path d="M44 38 Q44 43 48 43 Q52 43 52 39" fill="none" stroke="#f0a500" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Base / plataforma -->
  <rect x="16" y="52" width="19" height="4" rx="1.5" fill="#f0a500"/>

  <!-- Ruedas -->
  <circle cx="20" cy="57" r="3" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="31" cy="57" r="3" fill="none" stroke="#f0a500" stroke-width="2"/>

  <!-- Punto de unión torre/pluma -->
  <circle cx="25.5" cy="20.5" r="2.5" fill="#1e2128"/>
</svg>
